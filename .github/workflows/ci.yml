name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Ruff
        run: uv run --frozen ruff check --output-format=github .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked dependencies
        # --frozen fails if uv.lock is stale rather than silently resolving
        # something different from what was tested.
        run: uv sync --frozen
      - name: Fetch model artifacts
        # Model binaries are release assets, not git objects: versioned,
        # immutable, and kept out of the repository history.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download models-v1 --repo "$GITHUB_REPOSITORY" --dir models --clobber
          ls -lh models
      - name: Run tests
        run: uv run --frozen pytest --cov=. --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Advisory, not blocking: a fresh CVE in a transitive pin should not turn
      # the whole portfolio red overnight. Dependabot opens the fixing PR.
      # The audit runs against the resolved lockfile, so it covers the whole
      # transitive tree rather than just the direct pins.
      - name: Audit the locked dependency tree
        continue-on-error: true
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > locked-requirements.txt
          uvx pip-audit -r locked-requirements.txt --desc

  model-quality-gate:
    name: Model quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Check the shipped model still clears its floor
        run: uv run --frozen python scripts/check_model_quality.py
