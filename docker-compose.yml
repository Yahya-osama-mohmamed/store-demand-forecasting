version: '3.8'

services:
  api:
    build: .
    container_name: demand_api
    ports:
      - "8000:8000"
    volumes:
      # Mount models and data directories
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  streamlit:
    build: .
    container_name: demand_streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./figures:/app/figures
    environment:
      # Streamlit reads this env var to reach the API inside the docker network
      - API_URL=http://api:8000
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
