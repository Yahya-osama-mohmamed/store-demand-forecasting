[project]
name = "store-demand-forecasting"
version = "1.0.0"
description = "Demand forecasting across 500 store-item series, served as an API and exported to Lambda"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# xgboost is a runtime dependency: the champion is an XGBoost regressor and
# unpickling it needs the library present.
#
# On Linux the default wheel bundles the GPU build and costs ~450MB compressed
# in the image for hardware this service will never have. xgboost-cpu ships the
# same `xgboost` module at the same version without it. Windows wheels are
# already CPU-only, so the marker keeps local development on the plain package.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "joblib==1.6.0",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "xgboost-cpu==3.2.0; sys_platform == 'linux'",
    "xgboost==2.1.4; sys_platform != 'linux'",
]

[dependency-groups]
dev = [
    "lightgbm==4.7.0",
    "shap==0.51.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "plotly==7.0.0",
    "streamlit==1.62.0",
    "mlflow==3.15.2",
    "requests==2.34.2",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
    "pytest==9.1.1",
    "pytest-cov>=6",
    "httpx==0.28.1",
    "ruff==0.16.5",
]

[tool.ruff]
# Notebooks are deliberately excluded: `import a; import b` on one line and
# imports part-way down a file are normal notebook style, and enforcing library
# rules on exploratory cells produces noise rather than quality.
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "venv", "mlruns", "dashboard", "data", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008 is the FastAPI dependency-injection idiom (Depends(), File()), not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# The project is not installed as a package, so make the root importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# These are applications, not libraries: install the dependencies, not the project.
package = false
