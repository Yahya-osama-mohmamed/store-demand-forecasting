[project]
name = "store-demand-forecasting"
version = "1.0.0"
description = "Demand forecasting across 500 store-item series, served as an API and exported to Lambda"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# xgboost is a runtime dependency: the champion is an XGBoost
# regressor and unpickling it needs the library present.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "joblib==1.4.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
]

[dependency-groups]
dev = [
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "matplotlib==3.9.3",
    "seaborn==0.13.2",
    "plotly==5.24.1",
    "streamlit==1.41.1",
    "mlflow==2.19.0",
    "requests==2.32.3",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
    "pytest==8.3.4",
    "pytest-cov>=6",
    "httpx==0.28.1",
    "ruff==0.16.4",
]

[tool.ruff]
# Notebooks are deliberately excluded: `import a; import b` on one line and
# imports part-way down a file are normal notebook style, and enforcing library
# rules on exploratory cells produces noise rather than quality.
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "venv", "mlruns", "dashboard", "data", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008 is the FastAPI dependency-injection idiom (Depends(), File()), not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# The project is not installed as a package, so make the root importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# These are applications, not libraries: install the dependencies, not the project.
package = false
