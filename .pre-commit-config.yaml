# The same checks CI runs, but before the commit exists.
#   uv tool install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      # Fails if pyproject.toml changed without re-locking, which is the one
      # way a "locked" build can silently stop being reproducible.
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.ipynb$'
      - id: trailing-whitespace
        exclude: '\.ipynb$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
